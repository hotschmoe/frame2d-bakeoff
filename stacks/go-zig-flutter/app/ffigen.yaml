name: EngineBindings
description: dart:ffi bindings for the Zig shared engine (frame2d_engine.dll), generated by ffigen.
output: lib/generated/engine_bindings.dart
headers:
  entry-points:
    - ffigen/frame2d_engine.h
  include-directives:
    - ffigen/frame2d_engine.h
compiler-opts:
  - '-Wno-nullability-completeness'
preamble: |
  // ignore_for_file: type=lint
llvm-path:
  - ../.tools/llvm-x64
functions:
  leaf:
    include:
      - 'f2d_.*'
