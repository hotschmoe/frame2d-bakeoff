<!doctype html>
<html lang="en" style="height: 100%;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame2D</title>
</head>
<body style="height: 100%; margin: 0; padding: 0; overflow: hidden;">
<canvas id="dvui-canvas" tabindex="1" style="display: block; width: 100%; height: 100%; outline: none; caret-color: transparent;"></canvas>
<script type="module">
import { Dvui } from "./web.js";

const bench = new URLSearchParams(location.search).get("bench");
const modes = { drag: 1, render: 2, startup: 3, ready: 4, boundary: 5 };

const d = new Dvui();
const result = await WebAssembly.instantiateStreaming(fetch("web.wasm"), { dvui: d.imports });
d.setInstance(result.instance);
const ex = result.instance.exports;
if (bench in modes) ex.f2d_set_bench(modes[bench]);

if (bench === "boundary") {
  // crossing cost between JS and the wasm engine module
  const calls = 1000000;
  let t0 = performance.now();
  for (let i = 0; i < calls; i++) ex.f2d_noop();
  const noop_ns = (performance.now() - t0) * 1e6 / calls;
  const n = 38103, reps = 1000;
  let sink = 0;
  t0 = performance.now();
  for (let i = 0; i < reps; i++) {
    const p = ex.f2d_echo(n);
    const v = new Float64Array(ex.memory.buffer, p, n);
    sink += v[0] + v[n - 1];
  }
  const transfer_us = (performance.now() - t0) * 1000 / reps;
  console.log("BENCH " + JSON.stringify({ mode: "boundary", noop_ns, transfer_us, mechanism: "zero-copy view", sink }));
}

d.setCanvas("#dvui-canvas");
d.run();
</script>
</body>
</html>
