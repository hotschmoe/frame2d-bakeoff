[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli", "crates/server", "crates/bridge"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true


# Dev loop: keep line tables for panics but no debug info for dependencies (smaller objects, faster links).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
