[package]
name = "frame2d"
version = "0.1.0"
edition = "2024"

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:rusqlite"]
ui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.37.0", optional = true }
rfd = { version = "0.15", optional = true }

[[bin]]
name = "frame2d"
path = "src/bin/frame2d.rs"

[[bin]]
name = "frame2d-server"
path = "src/bin/frame2d-server.rs"
required-features = ["server"]

[[bin]]
name = "frame2d-app"
path = "src/bin/frame2d-app.rs"
required-features = ["ui"]

# Dev loop: only line tables for our own crate, none for dependencies (smaller PDB, faster link).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release: the hot code (engine) is in this crate, so it keeps codegen-units = 1; dependencies (egui,
# tokio, sqlite, ...) build with many units in parallel, which is what makes cold builds fast. No LTO:
# nothing hot crosses a crate boundary.
[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = true

[profile.release.package."*"]
codegen-units = 16

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Performance", "console"] }
