[package]
name = "frame2d-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frame2d-server"
path = "src/main.rs"

[dependencies]
frame2d-engine = { path = "../engine" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
